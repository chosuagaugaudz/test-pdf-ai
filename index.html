<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceQuiz AI - Nền tảng học tập và khảo thí thông minh</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        /* --- CORE DESIGN SYSTEM V6 (MUTATION THEME SYSTEM) --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease; }

        html[data-theme="light"] {
            --bg-main: #fafaf8; --bg-sidebar: #f5f2eb; --surface: #ffffff; --text-main: #111827; --text-muted: #6b7280;
            --border: #e5e7eb; --accent: #14b8a6; --accent-hover: #0d9488; --accent-light: #f0fdfa; --panel-surface: #f3f4f6;
            --panel-hover: #e5e7eb; --success: #10b981; --success-bg: #ecfdf5; --danger: #ef4444; --danger-bg: #fef2f2; --shadow-premium: rgba(0, 0, 0, 0.03);
        }

        html[data-theme="dark"] {
            --bg-main: #18181b; --bg-sidebar: #111827; --surface: #1f2937; --text-main: #f5f5f5; --text-muted: #9ca3af;
            --border: #374151; --accent: #14b8a6; --accent-hover: #0d9488; --accent-light: rgba(20, 184, 166, 0.15); --panel-surface: #2a2b32;
            --panel-hover: #374151; --success: #34d399; --success-bg: rgba(52, 211, 153, 0.12); --danger: #f87171; --danger-bg: rgba(248, 113, 113, 0.12); --shadow-premium: rgba(0, 0, 0, 0.3);
        }

        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* MÀN HÌNH ĐĂNG NHẬP */
        .login-container { background: var(--surface); padding: 3.5rem 3rem; border-radius: 20px; box-shadow: 0 20px 40px var(--shadow-premium); width: 100%; max-width: 450px; text-align: center; border: 1px solid var(--border); margin: auto; animation: fadeIn 0.4s ease; }
        .login-brand { font-size: 2.2rem; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem; letter-spacing: -1px; }
        .login-container p { color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem; line-height: 1.6; }
        .btn-google { background-color: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); padding: 0.85rem 1.5rem; border-radius: 12px; font-weight: 600; width: 100%; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 1rem; transition: all 0.2s ease; }
        .btn-google:hover { background-color: var(--panel-hover); transform: translateY(-1px); }

        /* BỐ CỤC CHÍNH */
        .app-container { display: none; width: 100vw; height: 100vh; position: relative; }

        /* SIDEBAR */
        .sidebar { position: absolute; top: 0; left: 0; width: 280px; height: 100%; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; z-index: 10; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .sidebar.collapsed { width: 0px !important; padding: 1.5rem 0px !important; transform: translateX(-100%); border-right: none !important; pointer-events: none; }
        .sidebar.collapsed * { display: none !important; }
        
        .resize-handle { position: absolute; top: 0; left: 280px; width: 4px; height: 100%; cursor: col-resize; z-index: 11; background: transparent; transition: background 0.2s; }
        .resize-handle:hover, .resize-handle.active { background: var(--accent); }
        .resize-handle.hidden { display: none !important; }

        .logo-area { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 1.25rem; color: var(--text-main); }
        .btn-icon { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--panel-hover); color: var(--text-main); }

        .usage-counter { background: var(--surface); border: 1px solid var(--border); padding: 0.75rem; border-radius: 10px; font-size: 0.85rem; color: var(--text-muted); }
        .usage-counter span { color: var(--accent); font-weight: 600; }

        /* KHU VỰC UPLOAD */
        .upload-box { border: 2px dashed var(--border); padding: 1.25rem 0.75rem; text-align: center; border-radius: 12px; cursor: pointer; background: var(--surface); transition: all 0.2s; position: relative; }
        .upload-box:hover { border-color: var(--accent); background: var(--accent-light); }
        .upload-box div { font-size: 0.88rem; font-weight: 600; margin-top: 0.5rem; }
        .upload-box p { font-size: 0.78rem; color: var(--text-muted); }
        .upload-progress-text { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-top: 4px; display: none; }

        .file-list-header { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.5rem; }
        .file-list { list-style: none; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 0.35rem; }
        .file-item-container { display: flex; flex-direction: column; gap: 2px; }
        .file-item { background: var(--surface); padding: 0.65rem; border-radius: 10px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); transition: all 0.2s; }
        .file-item.active { border-color: var(--accent); background: var(--accent-light); }
        .file-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
        .file-info-wrapper { display: flex; flex-direction: column; overflow: hidden; flex-grow: 1; cursor: pointer; }
        .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .file-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .btn-delete-file { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; }
        .btn-delete-file:hover { color: var(--danger); background: var(--danger-bg); }

        .quiz-history-tree { list-style: none; padding-left: 1.25rem; display: flex; flex-direction: column; gap: 2px; margin-bottom: 0.5rem; }
        .history-quiz-item { font-size: 0.78rem; color: var(--text-muted); padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 2px solid var(--border); }
        .history-quiz-item:hover { color: var(--accent); background: var(--panel-surface); border-left-color: var(--accent); }
        .history-quiz-score { font-weight: 600; font-size: 0.75rem; background: var(--accent-light); color: var(--accent); padding: 1px 6px; border-radius: 10px; }

        .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
        .btn-logout { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 500; font-size: 0.9rem; }
        .btn-logout:hover { background-color: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

        /* WORKSPACE CHÍNH */
        .workspace-wrapper { height: 100%; transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
        .top-navbar { height: 56px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: relative; z-index: 5; }
        .navbar-left-cluster { display: flex; align-items: center; gap: 12px; }
        .tabs-group { display: flex; gap: 1.5rem; height: 100%; }
        .tab-btn { background: transparent; border: none; font-size: 0.92rem; font-weight: 600; color: var(--text-muted); cursor: pointer; height: 100%; position: relative; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after { content: ""; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--accent); }
        .theme-select-menu { background: var(--surface); border: 1px solid var(--border); padding: 0.4rem; border-radius: 10px; color: var(--text-main); font-size: 0.85rem; outline: none; cursor: pointer; }

        .view-panel { flex-grow: 1; display: none; width: 100%; height: calc(100vh - 56px); overflow: hidden; }
        .view-panel.active { display: flex; }

        /* CHAT WORKSPACE */
        .chat-view-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .chat-messages { flex-grow: 1; padding: 2rem 20%; overflow-y: auto; display: flex; flex-direction: column; gap: 2rem; }
        .empty-dashboard { max-width: 680px; margin: auto; text-align: center; display: flex; flex-direction: column; gap: 2rem; }
        .empty-dashboard h2 { font-size: 1.8rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .empty-dashboard h2 span { color: var(--accent); }
        .suggested-cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; text-align: left; }
        .suggest-card { background: var(--surface); border: 1px solid var(--border); padding: 1.25rem; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .suggest-card:hover { border-color: var(--accent); background: var(--accent-light); transform: translateY(-1px); }

        .message-row { display: flex; width: 100%; gap: 1.25rem; animation: msgSlideUp 0.3s ease; }
        .message-row.user { justify-content: flex-end; }
        .avatar-box { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; background: var(--panel-surface); color: var(--text-main); }
        .message-row.bot .avatar-box { background: var(--accent-light); color: var(--accent); border: 1px solid var(--border); }
        .message { max-width: 85%; font-size: 0.98rem; line-height: 1.65; word-break: break-word; }
        .message.user { background-color: var(--panel-surface); padding: 0.85rem 1.25rem; border-radius: 14px; }
        .message.bot { color: var(--text-main); white-space: pre-wrap; }
        .message.bot strong { font-weight: 600; color: var(--text-main); }
        .message.bot code { background: var(--panel-surface); padding: 2px 5px; border-radius: 4px; font-family: monospace; color: #dc2626; }
        .message.system-error { background-color: var(--danger-bg); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); max-width: 600px; padding: 0.85rem 1.25rem; margin: auto; border-radius: 10px; }

        .chat-input-wrapper { padding: 1rem 20% 2rem 20%; background-color: var(--bg-main); flex-shrink: 0; }
        .chat-input-area { background-color: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 4px 20px var(--shadow-premium); }
        .chat-input-area input { flex-grow: 1; background: transparent; border: none; padding: 0.6rem 0.2rem; color: var(--text-main); outline: none; font-size: 1rem; }
        .btn-send { background: var(--accent); color: white; border: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* QUIZ MOODLE WORKSPACE */
        .quiz-view-container { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 280px; }
        .quiz-main-area { padding: 2rem 4rem; overflow-y: auto; height: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
        .quiz-sidebar-panel { background: var(--bg-sidebar); border-left: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; height: 100%; }
        
        .quiz-meta-header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 1rem; border-radius: 12px; font-size: 0.9rem; }
        .quiz-timer-box { font-weight: 700; font-size: 1.1rem; color: var(--danger); display: flex; align-items: center; gap: 6px; }
        
        .moodle-progress-bar-container { background: var(--border); height: 8px; border-radius: 4px; width: 100%; overflow: hidden; margin-top: -0.5rem; }
        .moodle-progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s; }

        .moodle-quiz-item { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 14px; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 12px var(--shadow-premium); }
        .quiz-source-file-badge { font-size: 0.76rem; font-weight: 600; color: var(--accent); background: var(--accent-light); padding: 3px 10px; border-radius: 6px; width: fit-content; border: 1px solid rgba(20, 184, 166, 0.2); margin-bottom: -4px; }
        .quiz-question-title { font-weight: 600; color: var(--text-main); font-size: 1.05rem; line-height: 1.4; }
        .quiz-options-group { display: flex; flex-direction: column; gap: 0.65rem; }
        .quiz-option-row { display: flex; align-items: center; gap: 12px; padding: 0.85rem 1.25rem; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background-color: var(--surface); transition: all 0.2s; }
        .quiz-option-row:hover { background-color: var(--panel-surface); }
        .quiz-option-row input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); }
        .quiz-option-row.moodle-correct { background-color: var(--success-bg) !important; border-color: var(--success) !important; color: var(--success); font-weight: 600; }
        .quiz-option-row.moodle-incorrect { background-color: var(--danger-bg) !important; border-color: var(--danger) !important; color: var(--danger); }
        
        .moodle-explanation-box { padding: 1rem 1.25rem; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; background-color: var(--surface); border-left: 4px solid var(--accent); border: 1px solid var(--border); }
        .moodle-explanation-box.correct-pane { border-left-color: var(--success); background-color: var(--success-bg); }
        .moodle-explanation-box.incorrect-pane { border-left-color: var(--danger); background-color: var(--danger-bg); }

        .moodle-submit-btn { background: var(--accent); color: white; border: none; padding: 0.85rem 2rem; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; align-self: flex-start; }
        .moodle-score-banner { padding: 1.2rem; border-radius: 12px; font-weight: 700; font-size: 1.2rem; text-align: center; background-color: var(--accent-light); border: 1px solid var(--accent); }
        
        .nav-grid-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .question-nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .nav-num-btn { background: var(--surface); border: 1px solid var(--border); height: 40px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .nav-num-btn.filled { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
        .nav-num-btn.correct { background: var(--success-bg); color: var(--success); border-color: var(--success); }
        .nav-num-btn.incorrect { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

        .typing-bubble { background-color: var(--panel-surface); padding: 0.85rem 1.25rem; border-radius: 14px; align-self: flex-start; display: flex; gap: 6px; }
        .typing-dot { width: 7px; height: 7px; background-color: var(--text-muted); border-radius: 50%; opacity: 0.4; animation: pulse-dot 1.2s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes msgSlideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse-dot { 50% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body>

    <div class="login-container" id="login-screen">
        <div class="login-brand">AceQuiz AI</div>
        <h1>Học trình Tốc chiến</h1>
        <p>Hệ thống trích xuất lý thuyết và cày đề trắc nghiệm thông minh chuẩn Series A.</p>
        <button class="btn-google" id="btn-login-mock">Kết nối tài khoản sinh viên</button>
    </div>

    <div class="app-container" id="app-screen">
        <aside class="sidebar" id="app-sidebar">
            <div class="logo-area">
                <span>AceQuiz AI</span>
                <button class="btn-icon" id="btn-collapse-sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><line x1="18" y1="12" x2="7" y2="12"/></svg>
                </button>
            </div>
            <div class="usage-counter" id="usage-panel">Hạn mức còn: <span id="tokens-left">100</span>/100</div>
            
            <div class="upload-box" id="drop-zone">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <div id="upload-box-title">Nạp Slide học phần</div>
                <p id="upload-box-desc">Kéo thả nhiều file PDF cùng lúc</p>
                <div class="upload-progress-text" id="upload-progress-node">Đang dịch văn bản...</div>
                <input type="file" id="file-input" accept=".pdf" multiple style="display: none !important;">
            </div>

            <div class="file-list-header">Kho học phần</div>
            <ul class="file-list" id="file-list-ui"></ul>
            <div class="sidebar-footer"><button class="btn-logout" id="btn-logout-mock">Đăng xuất</button></div>
        </aside>
        
        <div class="resize-handle" id="sidebar-resize-bar"></div>

        <div class="workspace-wrapper" id="content-workspace-area" style="margin-left: 280px; width: calc(100vw - 280px);">
            <header class="top-navbar">
                <div class="navbar-left-cluster">
                    <button class="btn-icon" id="btn-expand-sidebar-floating" style="display: none; margin-right: 8px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <nav class="tabs-group">
                        <button class="tab-btn active" id="tab-trigger-chat" onclick="switchWorkspace('chat')">Khung thoại AI</button>
                        <button class="tab-btn" id="tab-trigger-quiz" onclick="switchWorkspace('quiz')">Khảo thí Moodle</button>
                    </nav>
                </div>
                <div class="navbar-right-cluster">
                    <span id="active-file-indicator" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;"></span>
                    <select class="theme-select-menu" id="theme-switcher-node">
                        <option value="light">☀️ Light</option>
                        <option value="dark">🌙 Dark</option>
                        <option value="system">💻 System</option>
                    </select>
                </div>
            </header>

            <div class="view-panel active" id="panel-workspace-chat">
                <div class="chat-view-container">
                    <div class="chat-messages" id="chat-box"><div id="chat-anchor"></div></div>
                    <div class="chat-input-wrapper">
                        <div class="chat-input-area">
                            <input type="text" id="user-input" placeholder="Yêu cầu tóm tắt, tạo đề thi...">
                            <button class="btn-send" id="btn-send-msg">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="view-panel" id="panel-workspace-quiz">
                <div class="quiz-view-container">
                    <div class="quiz-main-area" id="quiz-render-engine-root"></div>
                    <div class="quiz-sidebar-panel">
                        <div class="nav-grid-title">Thời gian</div>
                        <div class="quiz-timer-box"><span id="moodle-timer-clock">00:00</span></div>
                        <div class="nav-grid-title" style="margin-top: 1rem;">Tiến độ</div>
                        <div class="moodle-progress-bar-container"><div class="moodle-progress-fill" id="moodle-progress-fill-node"></div></div>
                        <div class="nav-grid-title" style="margin-top: 1.5rem;">Bản đồ câu hỏi</div>
                        <div class="question-nav-grid" id="moodle-navigator-grid-root"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const BACKEND_URL = "https://spdf-t9x9.onrender.com/api/process";

        const state = { currentTokens: 100, uploadedFiles: [], conversationHistory: [], quizHistoryStore: {}, activeQuizInstance: null, sidebarWidth: 280, isSidebarCollapsed: false, currentTheme: "dark", isLoggedIn: false };

        const loginScreen = document.getElementById('login-screen'); const appScreen = document.getElementById('app-screen');
        const appSidebar = document.getElementById('app-sidebar'); const resizeHandle = document.getElementById('sidebar-resize-bar');
        const contentWorkspaceArea = document.getElementById('content-workspace-area'); const themeSwitcherNode = document.getElementById('theme-switcher-node');
        const dropZone = document.getElementById('drop-zone'); const fileInput = document.getElementById('file-input');
        const fileListUi = document.getElementById('file-list-ui'); const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input'); const btnSendMsg = document.getElementById('btn-send-msg');
        const quizRenderEngineRoot = document.getElementById('quiz-render-engine-root');
        let liveExamTimerInterval = null;

        themeSwitcherNode.addEventListener('change', (e) => { state.currentTheme = e.target.value; applyThemeSystem(); });
        function applyThemeSystem() { let activeTheme = state.currentTheme; if (activeTheme === 'system') activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', activeTheme); }

        document.getElementById('btn-collapse-sidebar').addEventListener('click', () => { state.isSidebarCollapsed = true; applySidebarDimensions(); });
        document.getElementById('btn-expand-sidebar-floating').addEventListener('click', () => { state.isSidebarCollapsed = false; applySidebarDimensions(); });

        function applySidebarDimensions() {
            if (state.isSidebarCollapsed) {
                appSidebar.classList.add('collapsed'); resizeHandle.classList.add('hidden'); document.getElementById('btn-expand-sidebar-floating').style.display = 'flex';
                contentWorkspaceArea.style.marginLeft = '0px'; contentWorkspaceArea.style.width = '100vw';
            } else {
                appSidebar.classList.remove('collapsed'); resizeHandle.classList.remove('hidden'); document.getElementById('btn-expand-sidebar-floating').style.display = 'none';
                appSidebar.style.width = `${state.sidebarWidth}px`; resizeHandle.style.left = `${state.sidebarWidth}px`;
                contentWorkspaceArea.style.marginLeft = `${state.sidebarWidth}px`; contentWorkspaceArea.style.width = `calc(100vw - ${state.sidebarWidth}px)`;
            }
        }

        function switchWorkspace(target) {
            document.querySelectorAll('.tab-btn, .view-panel').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-trigger-${target}`).classList.add('active'); document.getElementById(`panel-workspace-${target}`).classList.add('active');
            if (target === 'chat') forceScrollBottom(); else renderMoodleQuizWorkspaceArea();
        }

        function forceScrollBottom() { requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; const anchor = document.getElementById('chat-anchor'); if(anchor) anchor.scrollIntoView({ behavior: 'auto', block: 'end' }); }); }

        document.getElementById('btn-login-mock').addEventListener('click', () => { loginScreen.style.display = 'none'; appScreen.style.display = 'block'; state.isLoggedIn = true; applyThemeSystem(); applySidebarDimensions(); forceScrollBottom(); renderChatHistory(); });

        // UPLOAD (FIXED DOUBLE PICKER)
        dropZone.addEventListener('click', (e) => { if (e.target === fileInput) return; fileInput.click(); });
        fileInput.addEventListener('click', (e) => { e.stopPropagation(); });
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border)'; });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--border)'; if (e.dataTransfer.files.length > 0) handleMultipleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleMultipleFiles(e.target.files); });

        async function handleMultipleFiles(files) {
            document.getElementById('upload-box-title').textContent = "Đang đọc tài liệu...";
            document.getElementById('upload-progress-node').style.display = "block";
            for(let file of files) {
                if (!file.name.endsWith('.pdf')) continue;
                try {
                    const arrayBuffer = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = ""; for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const tc = await page.getTextContent(); fullText += tc.items.map(item => item.str).join(" ") + "\n"; }
                    state.uploadedFiles.push({ file_name: file.name, page_count: pdf.numPages, content: fullText.substring(0, 25000), checked: true });
                    if (!state.quizHistoryStore[file.name]) state.quizHistoryStore[file.name] = [];
                } catch(err) { alert(`Không đọc được file: ${file.name}`); }
            }
            document.getElementById('upload-box-title').textContent = "Nạp Slide học phần"; document.getElementById('upload-progress-node').style.display = "none"; fileInput.value = '';
            renderFileListAndQuizHistoryTree();
        }

        function renderFileListAndQuizHistoryTree() {
            fileListUi.innerHTML = '';
            state.uploadedFiles.forEach((file, index) => {
                const container = document.createElement('div'); container.className = 'file-item-container';
                const li = document.createElement('li'); li.className = `file-item ${file.checked ? 'active' : ''}`;
                const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = file.checked;
                checkbox.addEventListener('change', (e) => { state.uploadedFiles[index].checked = e.target.checked; li.classList.toggle('active', e.target.checked); document.getElementById('active-file-indicator').textContent = `Tài liệu đang chọn: ${state.uploadedFiles.filter(f=>f.checked).length}`; });
                const infoWrapper = document.createElement('div'); infoWrapper.className = 'file-info-wrapper'; infoWrapper.innerHTML = `<span class="file-name">${file.file_name}</span><span class="file-meta">📄 ${file.page_count} trang</span>`;
                const deleteBtn = document.createElement('button'); deleteBtn.className = 'btn-delete-file'; deleteBtn.innerHTML = `X`;
                deleteBtn.addEventListener('click', () => { state.uploadedFiles.splice(index, 1); renderFileListAndQuizHistoryTree(); });
                li.append(checkbox, infoWrapper, deleteBtn); container.appendChild(li);

                const historyList = state.quizHistoryStore[file.file_name] || [];
                if (historyList.length > 0) {
                    const ulTree = document.createElement('ul'); ulTree.className = 'quiz-history-tree';
                    historyList.forEach((quiz, qIndex) => {
                        const liTree = document.createElement('li'); liTree.className = 'history-quiz-item'; liTree.innerHTML = `<span>📝 Bài thi #${qIndex + 1}</span>`;
                        liTree.addEventListener('click', () => { state.activeQuizInstance = { sourceFile: file.file_name, historyIndex: qIndex, quizData: quiz.quizData, timerSeconds: quiz.timeSpent || 0, isTimerActive: !quiz.isSubmitted }; switchWorkspace('quiz'); });
                        ulTree.appendChild(liTree);
                    });
                    container.appendChild(ulTree);
                }
                fileListUi.appendChild(container);
            });
            document.getElementById('active-file-indicator').textContent = `Tài liệu đang chọn: ${state.uploadedFiles.filter(f=>f.checked).length}`;
        }

        function renderChatHistory() {
            chatBox.innerHTML = '<div id="chat-anchor"></div>';
            if (state.conversationHistory.length === 0) {
                const dash = document.createElement('div'); dash.className = 'empty-dashboard';
                dash.innerHTML = `<h2>Học phần Tốc chiến với <span>AceQuiz AI</span></h2><div class="suggested-cards-grid"><div class="suggest-card" onclick="userInput.value='Tạo 15 câu trắc nghiệm'; userInput.focus();"><h4>📝 Khảo thí trắc nghiệm 15 câu</h4></div><div class="suggest-card" onclick="userInput.value='Tóm tắt lý thuyết cốt lõi'; userInput.focus();"><h4>💡 Trích xuất tóm tắt cốt lõi</h4></div></div>`;
                chatBox.insertBefore(dash, document.getElementById('chat-anchor')); return;
            }
            state.conversationHistory.forEach((msg) => {
                const row = document.createElement('div'); row.className = `message-row ${msg.role === 'assistant' ? 'bot' : 'user'}`;
                row.innerHTML = `<div class="avatar-box">${msg.role === 'assistant' ? 'AI' : 'U'}</div><div class="message ${msg.role === 'assistant' ? 'bot' : 'user'}">${msg.content}</div>`;
                chatBox.insertBefore(row, document.getElementById('chat-anchor'));
            }); forceScrollBottom();
        }

        // CHAT ENGINE (FIXED ENTER KEY)
        btnSendMsg.addEventListener('click', handleUserAction);
        userInput.addEventListener('keyup', (e) => { if (e.key === 'Enter' && !userInput.disabled) { e.preventDefault(); handleUserAction(); } });

        async function handleUserAction() {
            const text = userInput.value.trim(); if (!text) return;
            const activeDocs = state.uploadedFiles.filter(f => f.checked); if (activeDocs.length === 0) return alert("Vui lòng tích chọn slide bên trái.");
            
            state.conversationHistory.push({ role: "user", content: text }); userInput.value = ''; renderChatHistory();

            let feature = "summarize"; let numQuestions = 10;
            if (text.toLowerCase().includes("câu") || text.toLowerCase().includes("trắc nghiệm") || text.toLowerCase().includes("đề")) { feature = "quiz"; const match = text.match(/(\d+)/); if(match) numQuestions = parseInt(match[1]); }
            
            const payload = { feature, user_message: text, documents: activeDocs, quiz_params: { num_questions: numQuestions } };

            const typingId = 'typing-' + Date.now();
            const anchor = document.getElementById('chat-anchor');
            const typingDiv = document.createElement('div'); typingDiv.className = 'typing-bubble'; typingDiv.id = typingId; typingDiv.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
            chatBox.insertBefore(typingDiv, anchor); forceScrollBottom(); userInput.disabled = true;

            try {
                const response = await fetch(BACKEND_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error("API Backend Lỗi (Có thể do API Key hoặc Server ngủ)");
                
                document.getElementById(typingId).remove(); userInput.disabled = false; userInput.focus();

                if (feature === "summarize") {
                    const reader = response.body.getReader(); const decoder = new TextDecoder("utf-8");
                    const botRow = document.createElement('div'); botRow.className = 'message-row bot'; botRow.innerHTML = `<div class="avatar-box">AI</div><div class="message bot streaming" id="stream-tgt-${typingId}"></div>`;
                    chatBox.insertBefore(botRow, anchor); const targetEl = document.getElementById(`stream-tgt-${typingId}`);
                    let currentText = "";
                    while (true) {
                        const { value, done } = await reader.read(); if (done) break;
                        const lines = decoder.decode(value).split("\n");
                        for (const line of lines) {
                            if (!line.startsWith("data: ")) continue;
                            try { const data = JSON.parse(line.substring(6)); if (data.text) { currentText += data.text; targetEl.innerHTML = currentText; forceScrollBottom(); } } catch(e) {}
                        }
                    }
                    state.conversationHistory.push({ role: "assistant", content: currentText });
                } else {
                    const resJson = await response.json(); const quizArrayData = resJson.data; const primaryFileName = activeDocs[0].file_name;
                    state.quizHistoryStore[primaryFileName].push({ quizData: quizArrayData, userAnswers: {}, isSubmitted: false, timeSpent: 0 });
                    state.activeQuizInstance = { sourceFile: primaryFileName, historyIndex: state.quizHistoryStore[primaryFileName].length - 1, quizData: quizArrayData, timerSeconds: 0, isTimerActive: true };
                    state.conversationHistory.push({ role: "assistant", content: `Đã tạo xong đề thi ${quizArrayData.length} câu. Hãy chuyển sang thẻ Khảo thí Moodle.` });
                    renderFileListAndQuizHistoryTree(); renderChatHistory(); switchWorkspace('quiz');
                }
            } catch(err) { document.getElementById(typingId).remove(); userInput.disabled = false; alert(err.message); }
        }

        // MOODLE RENDER
        function renderMoodleQuizWorkspaceArea() {
            clearInterval(liveExamTimerInterval); quizRenderEngineRoot.innerHTML = ''; document.getElementById('moodle-navigator-grid-root').innerHTML = '';
            const active = state.activeQuizInstance; if (!active) { quizRenderEngineRoot.innerHTML = `<div class="empty-dashboard"><h3>Chưa có bài thi</h3><p>Gõ "tạo đề thi" bên khung chat để AI gen bài nhé.</p></div>`; return; }
            
            const storeItem = state.quizHistoryStore[active.sourceFile][active.historyIndex];
            if (active.isTimerActive && !storeItem.isSubmitted) { liveExamTimerInterval = setInterval(() => { active.timerSeconds++; storeItem.timeSpent = active.timerSeconds; document.getElementById('moodle-timer-clock').textContent = `${Math.floor(active.timerSeconds/60).toString().padStart(2,'0')}:${(active.timerSeconds%60).toString().padStart(2,'0')}`; }, 1000); }
            
            const card = document.createElement('div');
            active.quizData.forEach((q, qIdx) => {
                const item = document.createElement('div'); item.className = 'moodle-quiz-item'; item.id = `q-anchor-${qIdx}`;
                item.innerHTML = `<div class="quiz-source-file-badge">📍 Nguồn: ${active.sourceFile}</div><div class="quiz-question-title">Câu ${qIdx + 1}: ${q.question}</div>`;
                const grp = document.createElement('div'); grp.className = 'quiz-options-group';
                Object.keys(q.options).forEach(optKey => {
                    const row = document.createElement('label'); row.className = 'quiz-option-row';
                    if(storeItem.isSubmitted && optKey === q.answer) row.classList.add('moodle-correct');
                    if(storeItem.isSubmitted && storeItem.userAnswers[qIdx] === optKey && optKey !== q.answer) row.classList.add('moodle-incorrect');
                    row.innerHTML = `<input type="radio" name="q_${qIdx}" value="${optKey}" ${storeItem.userAnswers[qIdx]===optKey?'checked':''} ${storeItem.isSubmitted?'disabled':''}><span>${optKey}. ${q.options[optKey]}</span>`;
                    row.querySelector('input').addEventListener('change', (e) => { storeItem.userAnswers[qIdx] = e.target.value; renderMoodleQuizWorkspaceArea(); });
                    grp.appendChild(row);
                }); item.appendChild(grp);
                if(storeItem.isSubmitted) { const exp = document.createElement('div'); exp.className = `moodle-explanation-box ${storeItem.userAnswers[qIdx] === q.answer ? 'correct-pane' : 'incorrect-pane'}`; exp.innerHTML = `<b>Đáp án: ${q.answer}</b><br/>Giải thích: ${q.explanation}`; item.appendChild(exp); }
                card.appendChild(item);
                
                const navBtn = document.createElement('button'); navBtn.className = 'nav-num-btn'; navBtn.textContent = qIdx + 1;
                if(storeItem.userAnswers[qIdx]) navBtn.classList.add('filled');
                if(storeItem.isSubmitted) navBtn.className = storeItem.userAnswers[qIdx] === q.answer ? 'nav-num-btn correct' : 'nav-num-btn incorrect';
                navBtn.onclick = () => document.getElementById(`q-anchor-${qIdx}`).scrollIntoView({behavior: 'smooth'});
                document.getElementById('moodle-navigator-grid-root').appendChild(navBtn);
            });
            
            if(storeItem.isSubmitted) {
                let score = 0; active.quizData.forEach((q, i) => { if(storeItem.userAnswers[i]===q.answer) score++; });
                card.innerHTML += `<div class="moodle-score-banner">Điểm: ${score}/${active.quizData.length}</div>`;
            } else {
                const submitBtn = document.createElement('button'); submitBtn.className = 'moodle-submit-btn'; submitBtn.textContent = 'Nộp bài';
                submitBtn.onclick = () => { if(confirm("Nộp bài?")) { storeItem.isSubmitted = true; active.isTimerActive = false; renderMoodleQuizWorkspaceArea(); renderFileListAndQuizHistoryTree(); } };
                card.appendChild(submitBtn);
            }
            quizRenderEngineRoot.appendChild(card);
            document.getElementById('moodle-progress-fill-node').style.width = `${(Object.keys(storeItem.userAnswers).length / active.quizData.length)*100}%`;
        }
    </script>
</body>
</html>
