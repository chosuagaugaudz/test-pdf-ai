<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceQuiz AI Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* =========================================
           THEME & TYPOGRAPHY
           ========================================= */
        :root[data-theme="dark"] {
            --bg-main: #212121;       
            --bg-sidebar: #171717;
            --bg-composer: #2f2f2f;
            --text-main: #ececec;
            --text-muted: #9b9b9b;
            --border: rgba(255, 255, 255, 0.1);
            --msg-user: #2f2f2f;
            --accent: #ececec;
            --accent-bg: #171717;
        }

        :root[data-theme="light"] {
            --bg-main: #ffffff;
            --bg-sidebar: #f9f9f9;
            --bg-composer: #f4f4f4;
            --text-main: #0d0d0d;
            --text-muted: #666666;
            --border: rgba(0, 0, 0, 0.1);
            --msg-user: #f4f4f4;
            --accent: #0d0d0d;
            --accent-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; position: relative; }
        button { cursor: pointer; border: none; outline: none; background: transparent; color: inherit; transition: 0.15s ease; }
        .hidden { display: none !important; }

        /* DRAG AND DROP OVERLAY */
        #drop-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 600; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        #drop-overlay.active { opacity: 1; pointer-events: all; }

        /* =========================================
           LAYOUT & SIDEBAR
           ========================================= */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        .sidebar {
            width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: margin-left 0.2s ease-out; flex-shrink: 0;
        }
        .sidebar.collapsed { margin-left: -260px; border: none; }
        
        .sidebar-header { padding: 12px; }
        .btn-new-chat { width: 100%; padding: 10px 12px; background: transparent; border-radius: 8px; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 8px; }
        .btn-new-chat:hover { background: var(--bg-composer); }
        
        .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }
        .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin: 16px 0 8px 8px; letter-spacing: 0.5px; }
        
        .doc-list { list-style: none; font-size: 13px; }
        .doc-list li { padding: 8px; border-radius: 6px; margin-bottom: 2px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;}
        .doc-list li:hover { background: var(--bg-composer); }

        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }

        /* =========================================
           MAIN AREA (CHAT & QUIZ)
           ========================================= */
        .main-area { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        .topbar { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
        .icon-btn { font-size: 18px; padding: 6px; border-radius: 6px; color: var(--text-muted); }
        .icon-btn:hover { background: var(--bg-composer); color: var(--text-main); }
        
        .workspace { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; padding-top: 48px; }

        /* CHAT EXPERIENCE */
        .chat-scroll { flex: 1; overflow-y: auto; padding: 0 16px; scroll-behavior: smooth; }
        .chat-container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
        
        .message { display: flex; gap: 16px; padding: 24px 0; }
        .message.user { flex-direction: row-reverse; }
        
        .msg-bubble { max-width: 85%; line-height: 1.6; font-size: 15px; }
        .message.user .msg-bubble { background-color: var(--msg-user); padding: 12px 16px; border-radius: 16px; }
        .message.bot .msg-bubble { padding: 4px 0; }

        /* COMPOSER */
        .composer-wrapper { padding: 16px; display: flex; justify-content: center; background: linear-gradient(180deg, transparent, var(--bg-main) 20%); }
        .composer { 
            width: 100%; max-width: 800px; background: var(--bg-composer); 
            border-radius: 24px; padding: 8px 12px; display: flex; align-items: flex-end; 
            border: 1px solid var(--border); gap: 8px; transition: 0.2s;
        }
        .composer:focus-within { border-color: var(--text-muted); }
        
        .btn-upload { padding: 8px; border-radius: 50%; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;}
        .btn-upload:hover { background: var(--bg-main); }
        
        .composer textarea { 
            flex: 1; background: transparent; border: none; color: var(--text-main); 
            resize: none; outline: none; font-size: 15px; max-height: 200px; padding: 10px 0; 
        }
        
        .btn-send { padding: 8px; border-radius: 50%; background: var(--accent); color: var(--accent-bg); display: flex; align-items: center; justify-content: center; }
        .btn-send:hover { opacity: 0.8; }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

        /* QUIZ WORKSPACE */
        .quiz-layout { display: flex; gap: 32px; max-width: 1000px; margin: 0 auto; width: 100%; height: 100%; padding: 0 24px 24px 24px; }
        .quiz-main { flex: 1; overflow-y: auto; padding-right: 16px; }
        .quiz-sidebar { width: 280px; padding-left: 24px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 24px; }
        
        .q-card { margin-bottom: 40px; }
        .q-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .q-option { 
            display: block; padding: 16px; border: 1px solid var(--border); 
            border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: 0.15s; 
        }
        .q-option:hover { background: var(--bg-composer); }
        .q-option input { margin-right: 12px; accent-color: var(--text-main); }

        .btn-submit-quiz { width: 100%; padding: 14px; background: var(--text-main); color: var(--bg-main); border-radius: 12px; font-weight: 600; font-size: 15px; }
        .btn-submit-quiz:hover { opacity: 0.9; }

        /* TYPING INDICATOR */
        .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
        .typing span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: blink 1.4s infinite both; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 20% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="drop-overlay">Kéo thả PDF vào đây để tải lên</div>

    <div class="app-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="btn-new" class="btn-new-chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    Chat mới
                </button>
            </div>
            <div class="sidebar-content">
                <p class="section-title">Tài liệu đã tải lên</p>
                <ul id="pdf-list" class="doc-list">
                    <li style="color: var(--text-muted); font-style: italic;">Chưa có PDF nào</li>
                </ul>
            </div>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-new-chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    Đổi giao diện
                </button>
            </div>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <button id="toggle-sidebar" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span id="system-status" style="font-size: 13px; color: var(--text-muted);">Hệ thống sẵn sàng</span>
            </header>

            <section id="workspace-chat" class="workspace">
                <div class="chat-scroll" id="chat-scroll">
                    <div class="chat-container" id="chat-history">
                        <div id="welcome-msg" style="text-align: center; padding-top: 10vh;">
                            <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 12px;">Tôi có thể giúp gì cho bạn?</h1>
                            <p style="color: var(--text-muted);">Tải PDF lên và yêu cầu tạo đề thi hoặc tóm tắt tài liệu.</p>
                        </div>
                    </div>
                </div>

                <div class="composer-wrapper">
                    <div class="composer">
                        <input type="file" id="pdf-upload" multiple accept=".pdf" class="hidden">
                        <label for="pdf-upload" class="btn-upload" title="Tải PDF lên">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </label>
                        
                        <textarea id="user-input" rows="1" placeholder="Nhắn tin cho AceQuiz..."></textarea>
                        
                        <button id="btn-send" class="btn-send" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </div>
            </section>

            <section id="workspace-quiz" class="workspace hidden">
                <div class="quiz-layout">
                    <div id="quiz-content" class="quiz-main"></div>
                    <div class="quiz-sidebar">
                        <div>
                            <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;">Tiến trình</h3>
                            <p style="font-size: 24px; font-weight: 600;"><span id="quiz-status">0</span> Câu</p>
                        </div>
                        <button id="btn-submit-quiz" class="btn-submit-quiz">Nộp bài</button>
                        <button id="btn-exit-quiz" class="btn-new-chat" style="justify-content: center; border: 1px solid var(--border);">Thoát đề thi</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const BACKEND_URL = 'https://spdf-t9x9.onrender.com/api/process';
        let activeDocs = [];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // --- 1. UI & THEME TOGGLE ---
        const root = document.documentElement;
        root.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        const textarea = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            btnSend.disabled = this.value.trim() === '';
        });

        // --- 2. WORKSPACE SWITCHER & NEW CHAT ---
        const wsChat = document.getElementById('workspace-chat');
        const wsQuiz = document.getElementById('workspace-quiz');
        const chatHistory = document.getElementById('chat-history');
        
        function switchWs(type) {
            wsChat.classList.add('hidden');
            wsQuiz.classList.add('hidden');
            if(type === 'chat') wsChat.classList.remove('hidden');
            if(type === 'quiz') wsQuiz.classList.remove('hidden');
        }
        document.getElementById('btn-exit-quiz').addEventListener('click', () => switchWs('chat'));

        // FIX: Nút Chat mới đã hoạt động dọn dẹp data
        document.getElementById('btn-new').addEventListener('click', () => {
            activeDocs = [];
            document.getElementById('pdf-list').innerHTML = '<li style="color: var(--text-muted); font-style: italic;">Chưa có PDF nào</li>';
            chatHistory.innerHTML = `
                <div id="welcome-msg" style="text-align: center; padding-top: 10vh;">
                    <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 12px;">Tôi có thể giúp gì cho bạn?</h1>
                    <p style="color: var(--text-muted);">Tải PDF lên và yêu cầu tạo đề thi hoặc tóm tắt tài liệu.</p>
                </div>
            `;
            document.getElementById('system-status').innerText = 'Hệ thống sẵn sàng';
            switchWs('chat');
        });

        // --- 3. UPLOAD PDF LOGIC (NÚT BẤM & KÉO THẢ) ---
        const sysStatus = document.getElementById('system-status');
        const pdfList = document.getElementById('pdf-list');
        const dropOverlay = document.getElementById('drop-overlay');

        // Logic xử lý chung cho file (cả bấm chọn lẫn kéo thả)
        async function handleFiles(files) {
            if (!files || files.length === 0) return;
            sysStatus.innerText = "Đang xử lý PDF...";
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type !== "application/pdf") {
                    alert("Chỉ hỗ trợ file PDF!");
                    continue;
                }
                try {
                    const text = await extractTextFromPDF(file);
                    activeDocs.push({ file_name: file.name, content: text });
                } catch (err) { 
                    alert(`Lỗi đọc file: ${file.name}`); 
                }
            }
            
            // Cập nhật giao diện Sidebar
            if(activeDocs.length > 0) pdfList.innerHTML = '';
            
            activeDocs.forEach(doc => {
                const li = document.createElement('li');
                li.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ${doc.file_name}`;
                pdfList.appendChild(li);
            });
            sysStatus.innerText = `Đã tải lên ${activeDocs.length} tài liệu.`;
        }

        // Bắt sự kiện Click nút Upload
        document.getElementById('pdf-upload').addEventListener('change', (e) => handleFiles(e.target.files));

        // Bắt sự kiện Kéo Thả (Drag & Drop)
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropOverlay.classList.add('active');
        });
        window.addEventListener('dragleave', (e) => {
            if (e.clientX === 0 || e.clientY === 0) dropOverlay.classList.remove('active');
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dropOverlay.classList.remove('active');
            if (e.dataTransfer.files) {
                handleFiles(e.dataTransfer.files);
            }
        });

        function extractTextFromPDF(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                        let text = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            text += content.items.map(item => item.str).join(" ") + "\n";
                        }
                        resolve(text);
                    } catch (e) { reject(e); }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // --- 4. CHAT & QUIZ RENDER ---
        const chatScroll = document.getElementById('chat-scroll');

        function appendMsg(role, content) {
            document.getElementById('welcome-msg')?.remove();
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const innerHTML = content === 'TYPING' 
                ? `<div class="typing"><span></span><span></span><span></span></div>`
                : (role === 'user' ? content : marked.parse(content));

            div.innerHTML = `<div class="msg-bubble markdown-body">${innerHTML}</div>`;
            chatHistory.appendChild(div);
            chatScroll.scrollTop = chatScroll.scrollHeight;
            return div.querySelector('.msg-bubble');
        }

        function renderQuiz(data) {
            switchWs('quiz');
            const container = document.getElementById('quiz-content');
            container.innerHTML = '';
            
            data.forEach((item, i) => {
                let options = '';
                for (const [k, v] of Object.entries(item.options)) {
                    options += `<label class="q-option"><input type="radio" name="q${i}" value="${k}"> <strong>${k}.</strong> ${v}</label>`;
                }
                container.innerHTML += `<div class="q-card"><div class="q-title">Câu ${i+1}: ${item.question}</div>${options}</div>`;
            });
            document.getElementById('quiz-status').innerText = data.length;
        }

        // --- 5. API FETCH LOGIC ---
        btnSend.addEventListener('click', async () => {
            const text = textarea.value.trim();
            if (!text) return;
            if (activeDocs.length === 0) { alert("Vui lòng tải PDF lên trước!"); return; }

            textarea.value = ''; textarea.style.height = 'auto'; btnSend.disabled = true;
            appendMsg('user', text);
            
            const isQuiz = text.toLowerCase().includes('đề') || text.toLowerCase().includes('trắc nghiệm') || text.toLowerCase().includes('câu hỏi');
            const botBubble = isQuiz ? null : appendMsg('bot', 'TYPING');

            try {
                const res = await fetch(BACKEND_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ feature: isQuiz ? 'quiz' : 'summarize', user_message: text, documents: activeDocs })
                });

                if (isQuiz) {
                    const data = await res.json();
                    if (data.data) renderQuiz(data.data);
                } else {
                    botBubble.innerHTML = '';
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = "";
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const lines = decoder.decode(value, {stream: true}).split('\n');
                        for (let line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    fullText += JSON.parse(line.substring(6)).text;
                                    botBubble.innerHTML = marked.parse(fullText);
                                    chatScroll.scrollTop = chatScroll.scrollHeight;
                                } catch(e){}
                            }
                        }
                    }
                }
            } catch (err) {
                if(botBubble) botBubble.innerHTML = "Lỗi kết nối máy chủ AI.";
            } finally { textarea.focus(); }
        });

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if(!btnSend.disabled) btnSend.click(); }
        });
    </script>
</body>
</html>
